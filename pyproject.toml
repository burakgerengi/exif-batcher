[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exif-batcher"
version = "0.1.0.dev0"
authors = [
  { name="Burak Gerengi", email="burakyigitgerengi@gmail.com" },
]
description = "cross-platform image metadata sanitization tool."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
exif-batcher = "exif_batcher.exif_batcher:main"

[project.urls]
Homepage = "https://github.com/burakgerengi/exif-batcher"
Issues = "https://github.com/burakgerengi/exif-batcher/issues"
